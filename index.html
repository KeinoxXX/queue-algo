<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очередь | Алгоритмизация и Программирование</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #182234;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        header p {
            color: var(--accent);
            font-size: 0.95rem;
            margin-top: 0.3rem;
            font-weight: 500;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 0.75rem;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #0f172a;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.5rem 0.85rem;
            font-size: 0.8rem;
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.85rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.85rem;
        }

        .queue-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .counter-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .queue-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .queue-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .queue-item-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .position {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            min-width: 1.5rem;
            text-align: center;
        }

        .student-info {
            display: flex;
            flex-direction: column;
        }

        .student-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .student-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            gap: 0.6rem;
            margin-top: 0.15rem;
        }

        .badge-lab {
            color: var(--accent);
        }

        .btn-delete {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .btn-delete:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Очередь на сдачу</h1>
        <p>Дисциплина: «Алгоритмизация и программирование»</p>
    </header>

    <div class="card">
        <form id="queueForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentName">Фамилия Имя</label>
                    <input type="text" id="studentName" placeholder="Иванов Иван" required>
                </div>
                <div class="form-group">
                    <label for="taskType">Цель сдачи</label>
                    <select id="taskType">
                        <option value="Лаб. работа">Лаб. работа</option>
                        <option value="Теория / Защита">Теория / Защита</option>
                        <option value="РГР / Курсовая">РГР / Проект</option>
                        <option value="Вопрос">Вопрос</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="labNumber">Номер работы</label>
                    <input type="text" id="labNumber" placeholder="№ 1, Вариант 12" required>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn-primary">Записаться в очередь</button>
                <button type="button" id="copyBtn" class="btn-secondary">Скопировать список в чат</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="queue-header">
            <h2>Текущий список</h2>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <span id="queueCounter" class="counter-badge">0 чел.</span>
                <button id="clearBtn" class="btn-secondary" style="padding: 0.2rem 0.5rem;">Очистить</button>
            </div>
        </div>

        <ul class="queue-list" id="queueList"></ul>
        <div id="emptyState" class="empty-state">Очередь пуста</div>
    </div>
</div>

<script>
    const form = document.getElementById('queueForm');
    const queueList = document.getElementById('queueList');
    const emptyState = document.getElementById('emptyState');
    const queueCounter = document.getElementById('queueCounter');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    let queue = JSON.parse(localStorage.getItem('algo_queue')) || [];

    function saveQueue() {
        localStorage.setItem('algo_queue', JSON.stringify(queue));
    }

    function renderQueue() {
        queueList.innerHTML = '';
        queueCounter.textContent = `${queue.length} чел.`;

        if (queue.length === 0) {
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        queue.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'queue-item';
            li.innerHTML = `
                <div class="queue-item-left">
                    <span class="position">${index + 1}</span>
                    <div class="student-info">
                        <span class="student-name">${escapeHtml(item.name)}</span>
                        <div class="student-meta">
                            <span>${escapeHtml(item.type)}</span>
                            <span>•</span>
                            <span class="badge-lab">${escapeHtml(item.lab)}</span>
                            <span>•</span>
                            <span>${item.time}</span>
                        </div>
                    </div>
                </div>
                <button class="btn-delete" onclick="removeItem(${index})">Сдал / Удалить</button>
            `;
            queueList.appendChild(li);
        });
    }

    function escapeHtml(string) {
        return String(string)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const nameInput = document.getElementById('studentName');
        const labInput = document.getElementById('labNumber');
        const typeSelect = document.getElementById('taskType');

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        queue.push({
            name: nameInput.value.trim(),
            type: typeSelect.value,
            lab: labInput.value.trim(),
            time: timeStr
        });

        saveQueue();
        renderQueue();

        nameInput.value = '';
        labInput.value = '';
        nameInput.focus();
    });

    window.removeItem = function(index) {
        queue.splice(index, 1);
        saveQueue();
        renderQueue();
    };

    clearBtn.addEventListener('click', () => {
        if (queue.length === 0) return;
        if (confirm('Очистить всю текущую очередь?')) {
            queue = [];
            saveQueue();
            renderQueue();
        }
    });

    copyBtn.addEventListener('click', () => {
        if (queue.length === 0) {
            alert('Очередь пуста.');
            return;
        }

        let text = '📋 Очередь («Алгоритмизация и Программирование»):\n';
        queue.forEach((item, i) => {
            text += `${i + 1}. ${item.name} — ${item.type} (${item.lab})\n`;
        });

        navigator.clipboard.writeText(text).then(() => {
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Скопировано!';
            setTimeout(() => copyBtn.textContent = originalText, 1500);
        });
    });

    renderQueue();
</script>
</body>
</html>
