<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очередь | Алгоритмизация и Программирование</title>
    <!-- Подключение Telegram WebApp SDK для интеграции с ботом -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #182234;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title-block h1 {
            font-size: 1.65rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .title-block p {
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 0.75rem;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.65rem 0.85rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input:focus {
            border-color: var(--accent);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.1rem;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #0f172a;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.45rem 0.75rem;
            font-size: 0.8rem;
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--text-secondary);
        }

        .btn-admin-active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border-color: var(--success);
        }

        .queue-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.8rem;
        }

        .queue-header h2 {
            font-size: 1.15rem;
            font-weight: 600;
        }

        .counter-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 0.2rem 0.55rem;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .queue-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .queue-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .queue-item.is-me {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        .queue-item-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .position {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            min-width: 1.4rem;
            text-align: center;
        }

        .student-info {
            display: flex;
            flex-direction: column;
        }

        .student-name-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .student-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .tag-me {
            font-size: 0.68rem;
            background: var(--accent);
            color: #0f172a;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .student-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            gap: 0.5rem;
            margin-top: 0.15rem;
        }

        .btn-delete {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.78rem;
        }

        .btn-delete:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Модальное окно пароля */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            z-index: 100;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 340px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-block">
            <h1>Электронная очередь</h1>
            <p>Алгоритмизация и программирование</p>
        </div>
        <div>
            <button id="adminToggleBtn" class="btn-secondary">Вход для старосты / админа</button>
        </div>
    </header>

    <div class="card">
        <form id="queueForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="studentName">Фамилия Имя</label>
                    <input type="text" id="studentName" placeholder="Иванов Иван" required>
                </div>
                <div class="form-group">
                    <label for="labNumber">Номер работы (необязательно)</label>
                    <input type="text" id="labNumber" placeholder="Лаб №2, Вариант 12">
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn-primary">Записаться в очередь</button>
                <button type="button" id="copyBtn" class="btn-secondary">Скопировать в буфер</button>
            </div>
        </form>
    </div>

    <div class="card">
        <div class="queue-header">
            <h2>Текущая очередь</h2>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <span id="queueCounter" class="counter-badge">0 чел.</span>
                <button id="clearBtn" class="btn-secondary" style="display: none; color: var(--danger);">Очистить всё</button>
            </div>
        </div>

        <ul class="queue-list" id="queueList"></ul>
        <div id="emptyState" class="empty-state">Очередь пуста</div>
    </div>
</div>

<!-- Модалка логина админа -->
<div class="modal-overlay" id="adminModal">
    <div class="modal">
        <h3 style="font-size: 1.1rem;">Вход для админа</h3>
        <input type="password" id="adminPasswordInput" placeholder="Введите пароль">
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
            <button class="btn-secondary" id="modalCancelBtn">Отмена</button>
            <button class="btn-primary" id="modalLoginBtn">Войти</button>
        </div>
    </div>
</div>

<script>
    // --- КОНФИГУРАЦИЯ ---
    const ADMIN_PASSWORD = "admin123"; // Замените на нужный пароль
    // Если бот запущен на сервере/ngrok, укажите его адрес, например: "http://localhost:8080"
    // Если оставить пустой строкой "", сайт будет работать через локальное хранилище браузера
    const API_URL = ""; 

    // Интеграция Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.expand();
        tg.ready();
    }

    // Инициализация уникального ID устройства студента
    let myDeviceId = localStorage.getItem('algo_device_id');
    if (!myDeviceId) {
        myDeviceId = 'dev_' + Math.random().toString(36).substring(2, 9) + Date.now().toString(36);
        localStorage.setItem('algo_device_id', myDeviceId);
    }

    let isAdmin = sessionStorage.getItem('algo_is_admin') === 'true';
    let queue = [];

    // Элементы DOM
    const form = document.getElementById('queueForm');
    const nameInput = document.getElementById('studentName');
    const labInput = document.getElementById('labNumber');
    const queueList = document.getElementById('queueList');
    const emptyState = document.getElementById('emptyState');
    const queueCounter = document.getElementById('queueCounter');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const adminToggleBtn = document.getElementById('adminToggleBtn');
    const adminModal = document.getElementById('adminModal');
    const adminPasswordInput = document.getElementById('adminPasswordInput');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalLoginBtn = document.getElementById('modalLoginBtn');

    // Автоподстановка имени, если сайт открыт внутри Telegram
    if (tg?.initDataUnsafe?.user) {
        const u = tg.initDataUnsafe.user;
        const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ');
        if (fullName) nameInput.value = fullName;
    }

    function updateAdminUI() {
        if (isAdmin) {
            adminToggleBtn.textContent = "Администратор (Выйти)";
            adminToggleBtn.classList.add("btn-admin-active");
            clearBtn.style.display = "inline-block";
        } else {
            adminToggleBtn.textContent = "Вход для старосты / админа";
            adminToggleBtn.classList.remove("btn-admin-active");
            clearBtn.style.display = "none";
        }
    }

    async function loadQueue() {
        if (API_URL) {
            try {
                const res = await fetch(`${API_URL}/api/queue`);
                queue = await res.json();
            } catch (e) {
                console.error("Ошибка загрузки с API:", e);
            }
        } else {
            queue = JSON.parse(localStorage.getItem('algo_queue') || '[]');
        }
        renderQueue();
    }

    async function syncQueue() {
        if (!API_URL) {
            localStorage.setItem('algo_queue', JSON.stringify(queue));
            renderQueue();
        }
    }

    function renderQueue() {
        queueList.innerHTML = '';
        queueCounter.textContent = `${queue.length} чел.`;

        if (queue.length === 0) {
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        queue.forEach((item, index) => {
            const isMyRecord = item.deviceId === myDeviceId;
            const canDelete = isAdmin || isMyRecord;

            const li = document.createElement('li');
            li.className = `queue-item ${isMyRecord ? 'is-me' : ''}`;

            const labDisplay = item.lab ? `<span>•</span><span>${escapeHtml(item.lab)}</span>` : '';
            const meBadge = isMyRecord ? `<span class="tag-me">Вы</span>` : '';
            const deleteBtnHtml = canDelete 
                ? `<button class="btn-delete" onclick="deleteItem('${item.id}')">${isAdmin && !isMyRecord ? 'Удалить (Админ)' : 'Сдал / Выйти'}</button>` 
                : '';

            li.innerHTML = `
                <div class="queue-item-left">
                    <span class="position">${index + 1}</span>
                    <div class="student-info">
                        <div class="student-name-row">
                            <span class="student-name">${escapeHtml(item.name)}</span>
                            ${meBadge}
                        </div>
                        <div class="student-meta">
                            <span>${item.time}</span>
                            ${labDisplay}
                        </div>
                    </div>
                </div>
                ${deleteBtnHtml}
            `;
            queueList.appendChild(li);
        });
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    // Добавление записи
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        const lab = labInput.value.trim();
        if (!name) return;

        const now = new Date();
        const newItem = {
            id: 'rec_' + Date.now() + Math.random().toString(36).substr(2, 4),
            deviceId: myDeviceId,
            name: name,
            lab: lab,
            time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        if (API_URL) {
            await fetch(`${API_URL}/api/queue`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newItem)
            });
            await loadQueue();
        } else {
            queue.push(newItem);
            syncQueue();
        }

        labInput.value = '';
    });

    // Удаление записи
    window.deleteItem = async function(id) {
        const item = queue.find(x => x.id === id);
        if (!item) return;

        if (!isAdmin && item.deviceId !== myDeviceId) {
            alert("Вы можете удалять только свою запись!");
            return;
        }

        if (API_URL) {
            await fetch(`${API_URL}/api/queue/${id}?admin_pwd=${isAdmin ? ADMIN_PASSWORD : ''}&device_id=${myDeviceId}`, {
                method: 'DELETE'
            });
            await loadQueue();
        } else {
            queue = queue.filter(x => x.id !== id);
            syncQueue();
        }
    };

    // Очистка очереди (только для админа)
    clearBtn.addEventListener('click', async () => {
        if (!isAdmin) return;
        if (!confirm('Очистить всю текущую очередь?')) return;

        if (API_URL) {
            await fetch(`${API_URL}/api/queue/clear?admin_pwd=${ADMIN_PASSWORD}`, { method: 'POST' });
            await loadQueue();
        } else {
            queue = [];
            syncQueue();
        }
    });

    // Логика модального окна админа
    adminToggleBtn.addEventListener('click', () => {
        if (isAdmin) {
            isAdmin = false;
            sessionStorage.removeItem('algo_is_admin');
            updateAdminUI();
            renderQueue();
        } else {
            adminModal.style.display = 'flex';
            adminPasswordInput.value = '';
            adminPasswordInput.focus();
        }
    });

    modalCancelBtn.addEventListener('click', () => {
        adminModal.style.display = 'none';
    });

    modalLoginBtn.addEventListener('click', () => {
        if (adminPasswordInput.value === ADMIN_PASSWORD) {
            isAdmin = true;
            sessionStorage.setItem('algo_is_admin', 'true');
            adminModal.style.display = 'none';
            updateAdminUI();
            renderQueue();
        } else {
            alert('Неверный пароль администратора!');
        }
    });

    // Копирование очереди в буфер
    copyBtn.addEventListener('click', () => {
        if (queue.length === 0) {
            alert('Очередь пуста.');
            return;
        }
        let text = '📋 Очередь («Алгоритмизация и Программирование»):\n';
        queue.forEach((item, i) => {
            text += `${i + 1}. ${item.name}${item.lab ? ` (${item.lab})` : ''}\n`;
        });
        navigator.clipboard.writeText(text).then(() => {
            const old = copyBtn.textContent;
            copyBtn.textContent = 'Скопировано!';
            setTimeout(() => copyBtn.textContent = old, 1500);
        });
    });

    updateAdminUI();
    loadQueue();

    // Автообновление раз в 3 секунды, если подключен сервер бота
    if (API_URL) {
        setInterval(loadQueue, 3000);
    }
</script>
</body>
</html>
